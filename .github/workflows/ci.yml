
name: Atlas Bank - CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    # Database configuration for CI
    env:
      ATLAS_DB_USER: atlas
      ATLAS_DB_PASSWORD: atlas

    # PostgreSQL service
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: atlasbank
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlasbank"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build and run tests
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
