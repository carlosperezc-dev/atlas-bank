spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: atlas-bank
  ai:
    openai:
      api-key: ollama
      base-url: http://localhost:11434/v1
      chat:
        model: qwen3:1.7b

  datasource:
    url: jdbc:postgresql://localhost:5434/atlasbank
    username: ${ATLAS_DB_USER}
    password: ${ATLAS_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8181/realms/atlas-bank
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    consumer:
      group-id: atlas-bank-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        "[spring.json.value.default.type]": com.atlas.bank.atlas_bank.domain.event.TransactionExecutedEvent
        "[spring.json.trusted.packages]": com.atlas.bank.atlas_bank.domain.event
        "[spring.deserializer.value.delegate.class]": org.springframework.kafka.support.serializer.JacksonJsonDeserializer

app:
  kafka:
    topics:
      transaction-events: transaction-events


server:
  port: 8080